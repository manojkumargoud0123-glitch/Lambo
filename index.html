<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0a" />
    <meta name="description" content="Tonino Lamborghini fleet intelligence — live map, trip analytics, charging, parking and geofence operations." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" as="image" href="/brand/shield.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Georama:wdth,wght@150,100..900&family=Kanit:wght@200;300;400;500;600&display=swap"
    />
    <!-- Logo descriptor face, subset to just the glyphs in "GOLF CART". -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&text=GOLFCART%20&display=swap" />
    <title>Tonino Lamborghini · Fleet</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('tl-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
